name: CI

on:
  push:
    branches: [main]
  pull_request:

# Runs for the same branch wait in line, and a waiting run gives way to a newer
# one. So an older commit never goes live after a newer one. On a pull request
# a new push stops the run in progress instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm audit --audit-level=high
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build
      # Run the browser gate on PRs too, so failures are caught before merge.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:smoke

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan history for secrets
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts="--all" --redact=100 --no-banner

  # Measures page speed on each pull request. The scores appear on the run's
  # summary page. A page whose middle score is below its minimum in
  # scripts/lighthouse.ts fails this check.
  lighthouse:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      # GitHub's default shell ignores a command that fails before a pipe.
      # `shell: bash` keeps the exit code of `pnpm lighthouse`, not of `tee`.
      # The port is PREVIEW_PORT in scripts/preview-port.ts.
      - shell: bash
        run: |
          pnpm preview > preview.log 2>&1 &
          if ! timeout 600 bash -c 'until curl -sf -o /dev/null http://localhost:8787/robots.txt; do sleep 3; done'; then
            cat preview.log
            exit 1
          fi
          status=0
          pnpm --silent lighthouse --check | tee lighthouse.txt || status=$?
          { echo '```'; cat lighthouse.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  # Puts `main` live on Cloudflare once the checks pass.
  deploy:
    needs: [check, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
